- title: "Superadiabatic quantum state transfer in spin chains" 
  image: Adiabatic1.pdf
  description: This paper proposes a superadiabatic protocol for quantum state transfer across spin chains with an odd number of spins. We show that the transfer protocal achieves arbitrarily high accuracy with minimal control and only requires the control of couplings between the qubits on the edge and the spin chain. We predict fidelities above 0.99 for an evolution of nanoseconds using typical spin exchange coupling values on the order of µeV. 
  authors: Ricardo Agundez, Charles D. Hill, Lloyd C. L. Hollenberg, Sven Rogge, Miriam Blaauboer
  link:
    url: https://arxiv.org/abs/1604.04885  
    display: Phys. Rev. A **95**, 012317 (2017)
