- title: "Multiparticle entanglement under the influence of decoherence"
  image: guhnefig.png
  description: We present a method to determine the decay of multiparticle quantum correlations under the influence of decoherence quantified by the geometric measure of entanglement. Using this measure, we compare the robustness of entanglement in GHZ-, cluster-, W- and Dicke states of four qubits and show that the Dicke state is the most robust one. We also determine the geometric measure analytically for decaying GHZ and cluster states of an arbitrary number of qubits.
  authors: O. Gühne, F. Bodoky and M. Blaauboer
  link:
    url: https://arxiv.org/abs/0805.2873
    display: Phys. Rev. A **78**, 060301(R) (2008)
  highlight: 1

- title: "An analytical decomposition protocol for optimal implementation of two-qubit entangling gates"
  image: devisser.png 
  description: This paper addresses the question how to implement a desired two-qubit gate U using a given tunable two-qubit entangling interaction Hint (t). We present a general protocol (based on the K1AK2 decomposition of unitary matrices) for calculating the smallest number of two-qubit gates [based on Hint(t)] and single-qubit rotations, and the explicit sequence of these operations that are required to implement U, illustrate our protocol for two types of interaction (Heisenberg exchange interaction and quantum inductive coupling) and discuss the relevance of our results for solid-state qubits.
  authors: M. Blaauboer and R.L. de Visser
  link:
    url: https://iopscience.iop.org/article/10.1088/1751-8113/41/39/395307
    display: J. Phys A Math. Theor. **41**, 395307 (2008)
  highlight: 1

