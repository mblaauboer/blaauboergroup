- title: "Multiparticle entanglement under the influence of decoherence"
  image: guhnefig.png
  description: We present a method to determine the decay of multiparticle quantum correlations under the influence of decoherence quantified by the geometric measure of entanglement. Using this measure, we compare the robustness of entanglement in GHZ-, cluster-, W- and Dicke states of four qubits and show that the Dicke state is the most robust one. We also determine the geometric measure analytically for decaying GHZ and cluster states of an arbitrary number of qubits.
  authors: O. Gühne, F. Bodoky and M. Blaauboer
  link:
    url: https://arxiv.org/abs/0805.2873
    display: Phys. Rev. A **78**, 060301(R) (2008)
  highlight: 1


- title: "Equivalence of pseudogap and pairing energy in a cuprate high-temperature superconductor"
  image: BSCCO_noise.png
  description: What is the pseudogap and what is the relation between pseudogap and superconductivity? – This is likely the most discussed issue in quantum matter over the last three decades. We report a direct evidence for equivalence of pseudogap and onset energy for electron pairing with our state-of-art electron pair microscope. This may inspire hope for materials with higher Tc.
  authors: Jiasen Niu, Maialen Ortego Larrazabal, Thomas Gozlinski, Yudai Sato, Koen M. Bastiaans, Tjerk Benschop, Jian-Feng Ge, Yaroslav M. Blanter, Genda Gu, Ingmar Swart, Milan P. Allan
  link:
    url: https://arxiv.org/abs/2409.15928
    display: arXiv
  highlight: 1

- title: "Why shot noise does not generally detect pairing in mesoscopic superconducting tunnel junctions"
  image: ShotNoise.png
  description: Can mesoscopic shot noise experiments show the doubling of the charge carriers in a superconductor? Turns out, it's complicated. We investigated this in several different samples, and made predictions as to what is necessary to make this work.
  authors: Jiasen Niu, Koen M. Bastiaans, Jianfeng Ge, Ruchi Tomar, John Jesudasan, Pratap Raychaudhuri, Max Karrer, Reinhold Kleiner, Dieter Koelle, Arnaud Barbier, Eduard F.C. Driessen, Yaroslav M. Blanter, Milan P. Allan
  link:
    url: https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.132.076001
    display: Phys. Rev. Lett. 132, 076001 (Editors' Suggestion)
  highlight: 1

- title: "Measuring local moiré lattice heterogeneity of twisted bilayer graphene"
  image: TBG_SL.png
  description: Why is there so much variation in TBG devices? And are open devices more disordered than encapsulated ones? We introduce a new method to continuously map inhomogeneities of a moiré lattice and apply it to open-device TBG to show that twist angle variation is small over areas of hundreds of nm.
  authors: T Benschop *, TA de Jong*, P Stepanov*, Xiaobo Lu, V Stalman, SJ van der Molen, DK Efetov, MP Allan
  link:
    url: https://journals.aps.org/prresearch/abstract/10.1103/PhysRevResearch.3.013153
    display:  Phys. Rev. Research 3, 013153 (2021)
  highlight: 1
  news2: See also [Nat Comm with the group of van der Molen](https://arxiv.org/abs/2107.14716)

